# It is _very important_ to correctly setup the host names, 
# otherwise Yarn containers will fail miserably without
# clearly telling what's wrong

- hosts: all

  tasks:

    - debug: msg="IP Address {{ hostvars[inventory_hostname]['ansible_ens3']['ipv4']['address'] }}"

    - name: setup hosts
      template:
        src: templates/hosts.j2
        dest: /etc/hosts