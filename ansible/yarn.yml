- hosts: all

  vars:
    java_home: /usr/lib/jvm/java-8-oracle
    hadoop_home: /opt/hadoop
    yarn: {
      resourcemanager: {
        webapp_address: '0.0.0.0:8088',
        hostname: frontend
      },
      scheduler: {
        maximum_allocation_mb: 9216,
        minimum_allocation_mb: 512
      },
      nodemanager: {
        memory: 6144, # leave some space for the OS
        cpu_vcores: 8,
        app_logs: /app-logs,
        log_dirs: /var/log/yarn-nodemanager,
        local_dirs: [/tmp/yarn-local-dirs,/var/spark/local]
      }
    }


  tasks:

    - name: correct java version selected
      alternatives:
        name: java
        path: "{{ java_home }}/bin/java"

    - name: create hadoop group
      group:
        name: hadoop
        state: present

    - name: create hadoop user
      user:
        name: hadoop
        group: hadoop
        state: present
        createhome: no
        system: yes

    - name: copy configuration templates
      template:
        src: "templates/{{ item }}.j2"
        dest: "{{ hadoop_home }}/etc/hadoop/{{ item }}"
      with_items:
        - hadoop-env.sh
        - yarn-site.xml
        - slaves
      tags: ['reconfig']

    - name: make yarn local dirs
      file:
        name: "{{ item }}"
        state: directory
        owner: hadoop
        group: hadoop
        mode: "u=rwx,g=rwx,o=rx"
      with_items: "{{ yarn.nodemanager.local_dirs }}"

    - name: fix owner and group
      file:
        path: /opt/hadoop
        state: directory
        recurse: yes
        owner: hadoop
        group: hadoop

    - name: install services
      copy:
        src: "files/{{ item }}"
        dest: "/etc/systemd/system/{{ item }}"
      with_items:
        - yarn-nodemanager.service
        - yarn-resourcemanager.service

    - name: enable Yarn resource manager
      service:
        name: yarn-resourcemanager
        enabled: yes
        state: restarted
      when: ansible_hostname == "frontend"
      tags: ['restart', 'reconfig']

    - name: enable Yarn node managers
      service:
        name: yarn-nodemanager
        enabled: yes
        state: restarted
      when: ansible_hostname != "frontend"
      tags: ['restart', 'reconfig']
      
    - name: cron job for cleaning up log files every hour
      cron:
        name: "cleanup"
        minute: "0"
        job: "rm -rf /tmp/logs/* /opt/hadoop/logs/*"