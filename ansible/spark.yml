---
- hosts: all

  vars:
    spark_volume: /dev/vdb
    spark_volume_mount_point: /var/spark
    
  tasks:

    - name: format the volume, if needed
      filesystem:
        fstype: ext4
        dev: "{{ spark_volume }}"
      when: ansible_hostname != "frontend"

    - name: make the mount point
      file: 
        name: "{{ spark_volume_mount_point }}"
        state: directory
        owner: hadoop
        group: hadoop
        mode: 766
        recurse: yes
      when: ansible_hostname != "frontend"        
      
    - name: mount the volume
      mount:
        src: "{{ spark_volume }}"
        path: "{{ spark_volume_mount_point }}"
        state: mounted
        fstype: ext4        
      when: ansible_hostname != "frontend"

    - name: make local directories
      file:
        path: /var/spark/local
        state: directory
        group: hadoop
        owner: hadoop
        mode: 776
      when: ansible_hostname != "frontend"        
    
    - name: configure spark
      template:
        src: templates/spark-env.sh.j2
        dest: /opt/spark/conf/spark-env.sh

    - name: configure spark defaults
      copy:
        src: files/spark-defaults.conf
        dest: /opt/spark/conf/spark-defaults.conf

    - name: change ownership of Spark symlink
      file:
        path: /opt/spark
        owner: hadoop
        group: hadoop

    - name: change ownership of Spark directories
      file:
        path: /opt/spark-2.4.4-bin-hadoop2.7
        owner: hadoop
        group: hadoop
        recurse: yes

    - name: copy systemd scripts on the frontend
      copy:
        src: "files/{{ item }}"
        dest: "/etc/systemd/system/{{ item }}"
      with_items:
        - spark-history-server.service
        - spark-master.service
      when: ansible_hostname == "frontend"      

    - name: enable and start systemd services on the workers
      service:
        name: "{{ item }}"
        state: restarted
        enabled: yes
      when: ansible_hostname == "frontend"
      with_items:
        - spark-history-server
        - spark-master.service

    - name: copy systemd scripts on the workers
      copy:
        src: "files/{{ item }}"
        dest: "/etc/systemd/system/{{ item }}"
      with_items:
        - spark-slave.service
      when: ansible_hostname != "frontend"      

    - name: disable systemd services on the workers
      service:
        name: "{{ item }}"
        state: stopped 
        enabled: yes
      when: ansible_hostname != "frontend"
      with_items:
        - spark-slave.service

    - name: make directory for Spark jars
      shell: /opt/hadoop/bin/hdfs dfs -mkdir -p /libs
      become_user: hadoop
      when: ansible_hostname == "frontend"

    - name: deploy libraries to speed up startup
      shell: /opt/hadoop/bin/hdfs dfs -put -f /opt/spark/jars/* /libs
      become_user: hadoop
      when: ansible_hostname == "frontend"


