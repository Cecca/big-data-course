---
- hosts: all

  vars:
    spark_version: 2.1.2

  tasks:

    - name: download Spark
      unarchive:
        src: "http://it.apache.contactlab.it/spark/spark-{{ spark_version }}/spark-{{ spark_version }}-bin-hadoop2.7.tgz"
        dest: /opt
        creates: /opt/spark 

    - name: install start-spark.sh script
      copy:
        src: start-spark.sh
        dest: /usr/sbin/start-spark.sh
        mode: u=rw,g=rx,o=r
        owner: root
        group: spark

    - name: add spark binaries to the path
      copy:
        src: spark-path.sh
        dest: /etc/profile.d/spark-path.sh