---
- hosts: all
  tasks:

    - name: install start-spark.sh script
      copy:
        src: start-spark.sh
        dest: /usr/sbin/start-spark.sh
        mode: u=rw,g=rx,o=r
        owner: root
        group: spark

    - name: link spark binaries to /usr/local/bin
      file:
        src: "/opt/spark/bin/{{ item }}"
        dest: "/usr/local/bin/{{ item }}"
        state: link
      with_items:
        - spark-submit
