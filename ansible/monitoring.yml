- hosts: all

  vars:
    frontend_ip: 10.67.41.127

  tasks:

    - name: import elastisearch key
      apt_key: 
        url: https://artifacts.elastic.co/GPG-KEY-elasticsearch
        state: present

    - name: setup apt repository
      apt_repository:
        repo: deb https://artifacts.elastic.co/packages/6.x/apt stable main
        state: present

    - name: install apt-transport-https
      apt:
        name: apt-transport-https
        state: present

    - name: install elasticsearch on frontend
      apt:
        name: elasticsearch
        state: present
      when: ansible_hostname == "frontend"

    - name: configure elasticsearch
      copy:
        src: files/elasticsearch.yml
        dest: /etc/elasticsearch/elasticsearch.yml
      when: ansible_hostname == "frontend"        

    - name: start elasticsearch
      service:
        name: elasticsearch
        state: started
        enabled: yes
      when: ansible_hostname == "frontend"      

    - name: create kibana group
      group:
        name: kibana
        state: present
      when: ansible_hostname == "frontend"

    - name: create kibana user
      user:
        name: kibana
        group: kibana
        state: present
        createhome: no
        system: yes
      when: ansible_hostname == "frontend"

    # The .deb installation does not work for Kibana
    - name: unpack
      unarchive:
        src: https://artifacts.elastic.co/downloads/kibana/kibana-6.0.0-linux-x86_64.tar.gz
        dest: /opt
        creates: /opt/kibana-6.0.0-linux-x86_64
        remote_src: yes
        owner: kibana
        group: kibana
      when: ansible_hostname == "frontend"

    - file:
        path: /opt/kibana-6.0.0-linux-x86_64
        owner: kibana
        group: kibana
        recurse: true
      when: ansible_hostname == "frontend"

    - file:
        src: /opt/kibana-6.0.0-linux-x86_64
        dest: /opt/kibana
        state: link
        owner: kibana
        group: kibana
      when: ansible_hostname == "frontend"

    - copy:
        src: files/kibana.service
        dest: /etc/systemd/system/kibana.service
      when: ansible_hostname == "frontend"

    - copy:
        src: files/kibana.yml
        dest: /opt/kibana/config/kibana.yml 
      when: ansible_hostname == "frontend"

    - name: enable kibana service
      service:
        name: kibana
        state: started
        enabled: yes
      when: ansible_hostname == "frontend"
    
    - apt:
        name: filebeat

    - template:
        src: templates/filebeat.yml.j2
        dest: /etc/filebeat/filebeat.yml

    - apt:
        name: metricbeat

    - template:
        src: templates/metricbeat.yml.j2
        dest: /etc/metricbeat/metricbeat.yml

    - service:
        name: "{{ item }}"
        state: restarted
        enabled: yes
      with_items:
        - filebeat
        - metricbeat

    - name: setup kibana dashboards for metricbeat
      shell: metricbeat setup --dashboards && touch /var/metricbeat-dashboard-created
      args:
        creates: /var/metricbeat-dashboard-created
      when: ansible_hostname == "frontend"
        
    - name: setup curator
      apt:
        name: python-pip
      when: ansible_hostname == "frontend"

    - pip:
        name: elasticsearch-curator
        state: present
        extra_args: --user
      become: yes
      become_user: root
      when: ansible_hostname == "frontend"

    - name: copy files
      copy:
        src: "files/{{ item }}"
        dest: "/etc/elasticsearch/{{ item }}"
      with_items:
        - curator.yml
        - delete_indices.yml        
      when: ansible_hostname == "frontend"

    - cron:
        name: "Clean old indices"
        minute: "0"
        hour: "0"
        job: "/root/.local/bin/curator --config /etc/elasticsearch/curator.yml /etc/elasticsearch/delete_indices.yml"
      when: ansible_hostname == "frontend"

